<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Tofu Manager - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-3 md:p-8 flex justify-center items-start min-h-screen">

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden grid grid-cols-1 md:grid-cols-12">
        
        <div class="md:col-span-5 bg-slate-50/50 p-6 border-b md:border-b-0 md:border-r border-slate-100 space-y-5">
            <div class="bg-gradient-to-r from-amber-500 to-yellow-500 p-4 -mx-6 -mt-6 mb-2 text-center text-white">
                <h1 class="text-xl font-bold tracking-wide">Golden Tofu Pro</h1>
                <p class="text-[11px] opacity-90">Enterprise Financial & Stock System</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tanggal Laporan</label>
                <input type="date" id="tglLaporan" class="block w-full rounded-xl border border-slate-200 bg-white py-2 px-3 text-slate-900 focus:border-amber-500 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Modal Utama (Target BEP)</label>
                <div class="relative rounded-md shadow-xs">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                        <span class="text-slate-400 text-xs">Rp</span>
                    </div>
                    <input type="number" id="modalUtama" class="block w-full rounded-xl border border-slate-200 bg-white py-2 pl-9 pr-3 text-slate-900 focus:border-amber-500 focus:outline-none text-sm" placeholder="Satu kali setting awal">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Penjualan (Omset)</label>
                    <div class="relative rounded-md shadow-xs">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-2.5">
                            <span class="text-slate-400 text-[11px]">Rp</span>
                        </div>
                        <input type="number" id="penjualanHarian" class="block w-full rounded-xl border border-slate-200 bg-white py-2 pl-7 pr-2 text-slate-900 focus:border-amber-500 focus:outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Total Pengeluaran</label>
                    <div class="relative rounded-md shadow-xs">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-2.5">
                            <span class="text-slate-400 text-[11px]">Rp</span>
                        </div>
                        <input type="number" id="pengeluaranHarian" class="block w-full rounded-xl border border-slate-200 bg-white py-2 pl-7 pr-2 text-slate-900 focus:border-amber-500 focus:outline-none text-sm">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 bg-amber-50/60 p-3 rounded-xl border border-amber-100">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-amber-800 mb-1">Stok Awal (Porsi)</label>
                    <input type="number" id="stokAwal" class="block w-full rounded-lg border border-amber-200 bg-white py-1.5 px-2 text-slate-900 focus:border-amber-500 focus:outline-none text-xs">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-amber-800 mb-1">Stok Terjual</label>
                    <input type="number" id="stokTerjual" class="block w-full rounded-lg border border-amber-200 bg-white py-1.5 px-2 text-slate-900 focus:border-amber-500 focus:outline-none text-xs">
                </div>
            </div>

            <button onclick="simpanData()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-amber-500/20 cursor-pointer text-center text-sm tracking-wide transition-all">
                Simpan & Kunci Laporan
            </button>
        </div>

        <div class="md:col-span-7 p-6 space-y-6">
            
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-emerald-50 border border-emerald-100 p-2.5 rounded-xl">
                    <p class="text-[10px] font-bold text-emerald-700 uppercase">Total Omset</p>
                    <p id="totalOmsetAll" class="text-xs font-extrabold text-emerald-600 mt-0.5">Rp 0</p>
                </div>
                <div class="bg-rose-50 border border-rose-100 p-2.5 rounded-xl">
                    <p class="text-[10px] font-bold text-rose-700 uppercase">Total Biaya</p>
                    <p id="totalBiayaAll" class="text-xs font-extrabold text-rose-600 mt-0.5">Rp 0</p>
                </div>
                <div class="bg-blue-50 border border-blue-100 p-2.5 rounded-xl" id="boxLabaAll">
                    <p class="text-[10px] font-bold text-blue-700 uppercase" id="labelLabaAll">Total Laba</p>
                    <p id="totalLabaAll" class="text-xs font-extrabold text-blue-600 mt-0.5">Rp 0</p>
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-1.5">
                <div class="flex justify-between text-xs font-bold text-slate-600">
                    <span>Akumulasi Progress Balik Modal (BEP)</span>
                    <span id="textBep">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                    <div id="barBep" class="bg-gradient-to-r from-teal-400 to-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                        <span>📋</span> Jurnal & Riwayat Keuangan
                    </h3>
                    <button onclick="hapusSemua()" class="text-[10px] text-rose-500 hover:underline font-semibold cursor-pointer">
                        Reset Semua Data
                    </button>
                </div>
                
                <div class="overflow-x-auto border border-slate-100 rounded-xl">
                    <table class="w-full text-left border-collapse bg-white text-xs">
                        <thead class="bg-slate-100 text-slate-700 uppercase font-bold text-[10px]">
                            <tr>
                                <th class="p-2.5 border-b border-slate-100">Tanggal</th>
                                <th class="p-2.5 border-b border-slate-100 text-right">Omset</th>
                                <th class="p-2.5 border-b border-slate-100 text-right">Pengeluaran</th>
                                <th class="p-2.5 border-b border-slate-100 text-right">Net Untung/Rugi</th>
                                <th class="p-2.5 border-b border-slate-100 text-center">Stok Sisa</th>
                                <th class="p-2.5 border-b border-slate-100 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelHistory" class="text-slate-600 divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Set tanggal default hari ini di form input
        document.getElementById('tglLaporan').valueToDate = new Date();
        document.getElementById('tglLaporan').value = new Date().toISOString().substring(0, 10);

        // Inisialisasi Database Lokal (LocalStorage)
        let DB_LAPORAN = JSON.parse(localStorage.getItem('golden_tofu_db')) || [];
        let MODAL_UTAMA = parseFloat(localStorage.getItem('golden_tofu_modal')) || 0;

        if(MODAL_UTAMA > 0) {
            document.getElementById('modalUtama').value = MODAL_UTAMA;
        }

        // Jalankan render awal saat aplikasi dibuka
        renderDashboard();

        function formatRupiah(angka) {
            const minus = angka < 0 ? "-" : "";
            return minus + "Rp " + Math.abs(angka).toLocaleString('id-ID');
        }

        function simpanData() {
            const tanggal = document.getElementById('tglLaporan').value;
            const modal = parseFloat(document.getElementById('modalUtama').value) || 0;
            const penjualan = parseFloat(document.getElementById('penjualanHarian').value) || 0;
            const pengeluaran = parseFloat(document.getElementById('pengeluaranHarian').value) || 0;
            const stokAwal = parseInt(document.getElementById('stokAwal').value) || 0;
            const stokTerjual = parseInt(document.getElementById('stokTerjual').value) || 0;

            if(!tanggal) {
                alert("Silakan pilih tanggal laporan terlebih dahulu!");
                return;
            }

            // Simpan konfigurasi modal utama secara permanen
            MODAL_UTAMA = modal;
            localStorage.setItem('golden_tofu_modal', modal);

            // Hitung net laba/rugi dan sisa stok
            const labaRugiNet = penjualan - pengeluaran;
            const sisaStok = stokAwal - stokTerjual;

            // Cari apakah tanggal ini sudah pernah diinput? Jika ya, timpa (update), jika belum, buat baru.
            const indexEksis = DB_LAPORAN.findIndex(item => item.tanggal === tanggal);
            
            const dataBaru = {
                tanggal, penjualan, pengeluaran, labaRugiNet, sisaStok
            };

            if(indexEksis > -1) {
                DB_LAPORAN[indexEksis] = dataBaru; // Update data lama
            } else {
                DB_LAPORAN.push(dataBaru); // Tambah log baru
            }

            // Urutkan riwayat berdasarkan tanggal terbaru
            DB_LAPORAN.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            // Simpan ke storage permanen browser
            localStorage.setItem('golden_tofu_db', JSON.stringify(DB_LAPORAN));

            // Bersihkan form input harian setelah simpan agar siap untuk input berikutnya
            document.getElementById('penjualanHarian').value = '';
            document.getElementById('pengeluaranHarian').value = '';
            document.getElementById('stokAwal').value = '';
            document.getElementById('stokTerjual').value = '';

            // Perbarui visual dashboard korporasi
            renderDashboard();
        }

        function renderDashboard() {
            const tbody = document.getElementById('tabelHistory');
            tbody.innerHTML = '';

            let totalOmset = 0;
            let totalBiaya = 0;
            let totalLabaRugi = 0;

            if(DB_LAPORAN.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400 italic">Belum ada rekaman laporan keuangan.</td></tr>`;
            }

            // Loop untuk merender isi tabel riwayat bisnis
            DB_LAPORAN.forEach((item, index) => {
                totalOmset += item.penjualan;
                totalBiaya += item.pengeluaran;
                totalLabaRugi += item.labaRugiNet;

                const warnaTeksNet = item.labaRugiNet > 0 ? 'text-emerald-600 font-semibold' : (item.labaRugiNet < 0 ? 'text-rose-600 font-semibold' : 'text-slate-500');
                
                // Format tampilan tanggal Indonesia manis (YYYY-MM-DD -> DD/MM)
                const partTgl = item.tanggal.split('-');
                const tglManis = `${partTgl[2]}/${partTgl[1]}/${partTgl[0].substring(2)}`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="p-2.5 font-medium text-slate-700">${tglManis}</td>
                        <td class="p-2.5 text-right text-slate-600">${formatRupiah(item.penjualan)}</td>
                        <td class="p-2.5 text-right text-slate-600">${formatRupiah(item.pengeluaran)}</td>
                        <td class="p-2.5 text-right ${warnaTeksNet}">${formatRupiah(item.labaRugiNet)}</td>
                        <td class="p-2.5 text-center text-slate-700 font-medium">${item.sisaStok} Porsi</td>
                        <td class="p-2.5 text-center">
                            <button onclick="hapusBaris(${index})" class="text-rose-400 hover:text-rose-600 font-bold px-1 transition-colors cursor-pointer">✕</button>
                        </td>
                    </tr>
                `;
            });

            // Update Angka Summary Board Bisnis Atas
            document.getElementById('totalOmsetAll').innerText = formatRupiah(totalOmset);
            document.getElementById('totalBiayaAll').innerText = formatRupiah(totalBiaya);
            document.getElementById('totalLabaAll').innerText = formatRupiah(totalLabaRugi);

            const boxLabaAll = document.getElementById('boxLabaAll');
            const labelLabaAll = document.getElementById('labelLabaAll');
            
            if(totalLabaRugi > 0) {
                labelLabaAll.innerText = "TOTAL UNTUNG";
                boxLabaAll.className = "bg-emerald-50 border border-emerald-100 p-2.5 rounded-xl text-emerald-700";
                document.getElementById('totalLabaAll').className = "text-xs font-extrabold text-emerald-600 mt-0.5";
            } else if (totalLabaRugi < 0) {
                labelLabaAll.innerText = "TOTAL RUGI";
                boxLabaAll.className = "bg-rose-50 border border-rose-100 p-2.5 rounded-xl text-rose-700";
                document.getElementById('totalLabaAll').className = "text-xs font-extrabold text-rose-600 mt-0.5";
            } else {
                labelLabaAll.innerText = "TOTAL LABA";
                boxLabaAll.className = "bg-blue-50 border border-blue-100 p-2.5 rounded-xl text-blue-700";
                document.getElementById('totalLabaAll').className = "text-xs font-extrabold text-blue-600 mt-0.5";
            }

            // Perhitungan Akumulasi BEP (Break-Even Point) Perusahaan
            let persenBep = 0;
            if (MODAL_UTAMA > 0 && totalOmset > 0) {
                persenBep = (totalOmset / MODAL_UTAMA) * 100;
                if(persenBep > 100) persenBep = 100;
            }
            document.getElementById('textBep').innerText = persenBep.toFixed(1) + "%";
            document.getElementById('barBep').style.width = persenBep + "%";
        }

        function hapusBaris(index) {
            if(confirm("Hapus catatan laporan untuk tanggal ini?")) {
                DB_LAPORAN.splice(index, 1);
                localStorage.setItem('golden_tofu_db', JSON.stringify(DB_LAPORAN));
                renderDashboard();
            }
        }

        function hapusSemua() {
            if(confirm("⚠️ PERINGATAN: Apakah Anda yakin ingin menghapus SELURUH riwayat laporan keuangan secara permanen? Tindakan ini tidak bisa dibatalkan.")) {
                localStorage.removeItem('golden_tofu_db');
                localStorage.removeItem('golden_tofu_modal');
                DB_LAPORAN = [];
                MODAL_UTAMA = 0;
                document.getElementById('modalUtama').value = '';
                renderDashboard();
            }
        }
    </script>
</body>
</html>
