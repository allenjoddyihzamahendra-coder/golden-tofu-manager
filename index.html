<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Tofu Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        
        <div class="bg-gradient-to-r from-amber-500 to-yellow-500 p-6 text-center text-white">
            <h1 class="text-2xl font-bold tracking-wide">Golden Tofu Manager</h1>
            <p class="text-xs opacity-90 mt-1">Sistem Laporan Keuangan & Stok Harian</p>
        </div>

        <div class="p-6 space-y-5">
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Modal Utama (Target BEP)</label>
                <div class="relative mt-1 rounded-md shadow-xs">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                        <span class="text-slate-500 sm:text-sm">Rp</span>
                    </div>
                    <input type="number" id="modalUtama" class="block w-full rounded-xl border border-slate-200 py-2.5 pl-9 pr-3 text-slate-900 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500 text-sm" placeholder="Contoh: 5000000">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Penjualan Hari Ini</label>
                    <div class="relative mt-1 rounded-md shadow-xs">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <span class="text-slate-500 text-xs">Rp</span>
                        </div>
                        <input type="number" id="penjualanHarian" class="block w-full rounded-xl border border-slate-200 py-2.5 pl-8 pr-3 text-slate-900 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500 text-sm" placeholder="Total omset">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Pengeluaran Hari Ini</label>
                    <div class="relative mt-1 rounded-md shadow-xs">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                            <span class="text-slate-500 text-xs">Rp</span>
                        </div>
                        <input type="number" id="pengeluaranHarian" class="block w-full rounded-xl border border-slate-200 py-2.5 pl-8 pr-3 text-slate-900 focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500 text-sm" placeholder="Bahan baku, dll">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 bg-amber-50/50 p-3 rounded-xl border border-amber-100">
                <div>
                    <label class="block text-xs font-bold uppercase text-amber-800 mb-1">Stok Awal (Porsi/Biji)</label>
                    <input type="number" id="stokAwal" class="block w-full rounded-lg border border-amber-200 bg-white py-2 px-3 text-slate-900 focus:border-amber-500 focus:outline-none text-sm" placeholder="Mula-mula">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-amber-800 mb-1">Stok Terjual (Porsi/Biji)</label>
                    <input type="number" id="stokTerjual" class="block w-full rounded-lg border border-amber-200 bg-white py-2 px-3 text-slate-900 focus:border-amber-500 focus:outline-none text-sm" placeholder="Laku">
                </div>
            </div>

            <button onclick="hitungLaporan()" class="w-full bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl transition duration-150 shadow-md shadow-amber-500/20 cursor-pointer text-center tracking-wide">
                Hitung Laporan Keuangan
            </button>

            <div class="mt-6 pt-4 border-t border-slate-100 space-y-3.5">
                
                <div class="flex justify-between items-center text-sm px-1">
                    <span class="text-slate-500 font-medium">Sisa Stok Tahu:</span>
                    <span id="sisaStok" class="font-bold text-slate-800">0 Porsi</span>
                </div>

                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 transition-all duration-300" id="boxStatus">
                    <span class="text-sm font-medium text-slate-600" id="labelStatus">Hasil Harian:</span>
                    <span id="hasilKeuangan" class="font-bold text-base text-slate-800">Rp 0</span>
                </div>

                <div class="space-y-1 px-1">
                    <div class="flex justify-between text-xs font-semibold text-slate-500">
                        <span>Progress Balik Modal (BEP)</span>
                        <span id="textBep">0%</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                        <div id="barBep" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        function formatRupiah(angka) {
            return "Rp " + Math.abs(angka).toLocaleString('id-ID');
        }

        function hitungLaporan() {
            // Ambil Nilai Input
            const modalUtama = parseFloat(document.getElementById('modalUtama').value) || 0;
            const penjualan = parseFloat(document.getElementById('penjualanHarian').value) || 0;
            const pengeluaran = parseFloat(document.getElementById('pengeluaranHarian').value) || 0;
            const stokAwal = parseInt(document.getElementById('stokAwal').value) || 0;
            const stokTerjual = parseInt(document.getElementById('stokTerjual').value) || 0;

            // 1. Hitung Sisa Stok
            const sisaStok = stokAwal - stokTerjual;
            document.getElementById('sisaStok').innerText = sisaStok >= 0 ? `${sisaStok} Porsi / Biji` : "Stok Over (Cek Input)";

            // 2. Hitung Keuntungan / Kerugian Bersih Hari Ini
            const labaBersih = penjualan - pengeluaran;
            const boxStatus = document.getElementById('boxStatus');
            const labelStatus = document.getElementById('labelStatus');
            const hasilKeuangan = document.getElementById('hasilKeuangan');

            if (labaBersih > 0) {
                labelStatus.innerText = "Keuntungan Bersih:";
                hasilKeuangan.innerText = formatRupiah(labaBersih);
                // Ubah warna box jadi hijau jika untung
                boxStatus.className = "flex justify-between items-center p-3 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-900";
                hasilKeuangan.className = "font-bold text-base text-emerald-600";
            } else if (labaBersih < 0) {
                labelStatus.innerText = "Kerugian Harian:";
                hasilKeuangan.innerText = formatRupiah(labaBersih);
                // Ubah warna box jadi merah jika rugi
                boxStatus.className = "flex justify-between items-center p-3 rounded-xl bg-rose-50 border border-rose-100 text-rose-900";
                hasilKeuangan.className = "font-bold text-base text-rose-600";
            } else {
                labelStatus.innerText = "Hasil Harian:";
                hasilKeuangan.innerText = "Rp 0 (Simbang/Balik Modal)";
                boxStatus.className = "flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100 text-slate-700";
                hasilKeuangan.className = "font-bold text-base text-slate-700";
            }

            // 3. Hitung Progress BEP terhadap Modal Utama
            let persenBep = 0;
            if (modalUtama > 0 && penjualan > 0) {
                persenBep = (penjualan / modalUtama) * 100;
                if (persenBep > 100) persenBep = 100; // Batasi maksimal grafik 100%
            }
            
            document.getElementById('textBep').innerText = persenBep.toFixed(1) + "%";
            document.getElementById('barBep').style.width = persenBep + "%";
        }
    </script>
</body>
</html>
